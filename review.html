<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leave a Review — American Glass Experts</title>
  <meta name="robots" content="noindex" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: 'DM Sans', system-ui, sans-serif; background: #f7f8fa; }

    .wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      text-align: center;
    }

    .logo {
      width: 52px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.55rem;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.3;
      margin-bottom: 10px;
    }

    .sub {
      font-size: 0.95rem;
      color: #6b7280;
      margin-bottom: 36px;
      max-width: 320px;
      line-height: 1.6;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 340px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 17px 24px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn:active { transform: scale(0.97); }

    .btn-google {
      background: #fff;
      color: #0f172a;
      border: 1.5px solid #e2e6ea;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    .btn-google:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.13); }

    .btn-yelp {
      background: #d32323;
      color: #fff;
      box-shadow: 0 2px 12px rgba(211,35,35,0.25);
    }
    .btn-yelp:hover { box-shadow: 0 4px 20px rgba(211,35,35,0.35); }

    .stars {
      font-size: 1.4rem;
      margin-bottom: 6px;
      letter-spacing: 2px;
    }

    .footer {
      margin-top: 40px;
      font-size: 0.8rem;
      color: #9ca3af;
    }
    .footer a { color: #9ca3af; }
  </style>
</head>
<body>
<div class="wrap">
  <img src="logo-icon-dark.png" class="logo" alt="American Glass Experts" />
  <div class="stars">⭐⭐⭐⭐⭐</div>
  <h1>How'd we do?</h1>
  <p class="sub">Takes 30 seconds. Means the world to a small business. Thank you.</p>

  <div class="btn-group">
    <a href="https://share.google/bjUDf31y962SkEPvv" class="btn btn-google" target="_blank" rel="noopener">
      <svg width="22" height="22" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <path fill="#4285F4" d="M47.5 24.5c0-1.6-.1-3.2-.4-4.7H24v8.9h13.2c-.6 3-2.3 5.6-4.9 7.3v6h7.9c4.6-4.3 7.3-10.6 7.3-17.5z"/>
        <path fill="#34A853" d="M24 48c6.5 0 12-2.1 16-5.8l-7.9-6c-2.1 1.4-4.9 2.3-8.1 2.3-6.2 0-11.5-4.2-13.4-9.9H2.5v6.2C6.4 42.5 14.6 48 24 48z"/>
        <path fill="#FBBC05" d="M10.6 28.6c-.5-1.4-.7-2.9-.7-4.6s.2-3.2.7-4.6v-6.2H2.5C.9 16.5 0 20.1 0 24s.9 7.5 2.5 10.8l8.1-6.2z"/>
        <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.9 2.5 30.4 0 24 0 14.6 0 6.4 5.5 2.5 13.2l8.1 6.2C12.5 13.7 17.8 9.5 24 9.5z"/>
      </svg>
      Review on Google
    </a>

    <a href="https://www.yelp.com/biz/american-glass-experts-san-fernando-valley-4" class="btn btn-yelp" target="_blank" rel="noopener">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path d="M20.16 12.6l-4.83-1.17c-.57-.14-1.05.4-.84.95l1.75 4.63c.22.57.97.66 1.31.15l3.08-4.13c.28-.37.03-.89-.47-1.43zM12.02 2.01C9.06 2.01 2 5.34 2 12c0 6.63 5.37 10 10 10 1.57 0 3.06-.36 4.37-1.01.4-.2.52-.72.24-1.08l-3.01-3.92c-.35-.46-.07-1.12.5-1.19l5.07-.65c.54-.07.88-.62.72-1.14C18.78 9.07 16.14 2.01 12.02 2.01z"/>
      </svg>
      Review on Yelp
    </a>
  </div>

  <p class="footer">
    <a href="/">americanglassexperts.us</a> &nbsp;·&nbsp; (805) 750-6471
  </p>
</div>
</body>
</html>
